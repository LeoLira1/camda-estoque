[client]
toolbarMode = "minimal"

# Tema escuro minimalista — espelha theme.PALETTE / tokens --c-* do CSS
# global (app_turso.py). Widgets nativos (dataframe, inputs, sliders,
# selects, datas) herdam daqui.
[theme]
base = "dark"
primaryColor = "#D7F000"
backgroundColor = "#111214"
secondaryBackgroundColor = "#1C1D21"
textColor = "#F2F2F2"
borderColor = "#2E3036"
baseRadius = "12px"
buttonRadius = "full"
font = "Inter, sans-serif"
codeFont = "IBM Plex Mono, monospace"
