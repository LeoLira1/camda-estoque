[client]
toolbarMode = "minimal"

# Tema claro minimalista — espelha theme.PALETTE / tokens --c-* do CSS
# global (app_turso.py). Widgets nativos (dataframe, inputs, sliders,
# selects, datas) herdam daqui.
[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#ECECEC"
secondaryBackgroundColor = "#F8F8F8"
textColor = "#111111"
borderColor = "#E2E2E2"
baseRadius = "12px"
buttonRadius = "full"
font = "Inter, sans-serif"
codeFont = "IBM Plex Mono, monospace"
